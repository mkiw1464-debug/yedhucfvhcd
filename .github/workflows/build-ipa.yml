name: Build Unsigned IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      # ============================================================
      # RUBY
      # ============================================================
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      # ============================================================
      # COCOAPODS
      # ============================================================
      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version

      # ============================================================
      # FLUTTER DEPENDENCIES
      # ============================================================
      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      # ============================================================
      # GENERATE IOS PROJECT IF MISSING
      # ============================================================
      - name: Generate iOS project
        run: |
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "Runner.xcodeproj missing."
            echo "Generating iOS project..."
            flutter create --platforms=ios .
          else
            echo "Runner.xcodeproj exists."
          fi

      # ============================================================
      # VERIFY IOS PROJECT
      # ============================================================
      - name: Verify iOS project
        run: |
          set -e

          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Podfile

          echo "Runner.xcodeproj: OK"
          echo "Podfile: OK"

      # ============================================================
      # POD INSTALL
      # ============================================================
      - name: Install Pods
        working-directory: ios
        run: |
          pod install --repo-update

      # ============================================================
      # DISABLE SIGNING IN RUNNER PROJECT
      # ============================================================
      - name: Disable code signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("ios/Runner.xcodeproj/project.pbxproj")

          if not path.exists():
              raise SystemExit("Runner.xcodeproj/project.pbxproj not found")

          text = path.read_text()

          # Disable code signing
          text = re.sub(
              r'CODE_SIGNING_ALLOWED\s*=\s*YES;',
              'CODE_SIGNING_ALLOWED = NO;',
              text
          )

          text = re.sub(
              r'CODE_SIGNING_REQUIRED\s*=\s*YES;',
              'CODE_SIGNING_REQUIRED = NO;',
              text
          )

          # Remove development team
          text = re.sub(
              r'^\s*DEVELOPMENT_TEAM\s*=.*?;\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove provisioning profile
          text = re.sub(
              r'^\s*PROVISIONING_PROFILE_SPECIFIER\s*=.*?;\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Disable automatic signing
          text = text.replace(
              'ProvisioningStyle = Automatic;',
              'ProvisioningStyle = Manual;'
          )

          path.write_text(text)

          print("========================================")
          print("CODE SIGNING DISABLED")
          print("========================================")
          PY

      # ============================================================
      # CLEAN XCODE BUILD
      # ============================================================
      - name: Clean Xcode build
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            clean \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # ============================================================
      # BUILD UNSIGNED APP
      # ============================================================
      - name: Build unsigned iOS app
        run: |
          set -e

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # ============================================================
      # FIND APP
      # ============================================================
      - name: Find Runner.app
        run: |
          echo "Searching for Runner.app..."

          find build/ios \
            -type d \
            -name "Runner.app" \
            -print

      # ============================================================
      # CREATE IPA
      # ============================================================
      - name: Create unsigned IPA
        run: |
          set -e

          APP_PATH="build/ios/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Standard path not found."
            echo "Searching..."
            
            APP_PATH=$(find build/ios \
              -type d \
              -name "Runner.app" \
              -path "*Release-iphoneos*" \
              -print -quit)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app was not found."
            exit 1
          fi

          echo "Using:"
          echo "$APP_PATH"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload

          cp -R "$APP_PATH" build/ipa/Payload/Runner.app

          cd build/ipa

          zip -qry ../../FFExternal-unsigned.ipa Payload

          cd ../..

          echo "========================================"
          echo "UNSIGNED IPA CREATED"
          echo "========================================"

          ls -lh FFExternal-unsigned.ipa

      # ============================================================
      # VERIFY IPA
      # ============================================================
      - name: Verify IPA
        run: |
          set -e

          if [ ! -f "FFExternal-unsigned.ipa" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo "IPA:"
          ls -lh FFExternal-unsigned.ipa

          echo ""
          echo "IPA contents:"
          unzip -l FFExternal-unsigned.ipa | head -50

      # ============================================================
      # UPLOAD IPA
      # ============================================================
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-unsigned-IPA
          path: FFExternal-unsigned.ipa
          if-no-files-found: error
