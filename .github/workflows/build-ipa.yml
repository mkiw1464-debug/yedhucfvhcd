name: Build FF External IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # ─── Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Flutter setup ──────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # ─── Ruby + CocoaPods ───────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version

      # ─── Flutter pub get ────────────────────────────────────────────
      - name: Get Flutter dependencies
        run: flutter pub get

      # ─── Generate localization ──────────────────────────────────────
      - name: Generate localization files
        run: flutter gen-l10n

      # ─── Pod install ────────────────────────────────────────────────
      - name: CocoaPods install
        run: |
          cd ios
          pod install --repo-update
        env:
          # Prevents interactive prompts
          CI: true

      # ─── Xcode select ───────────────────────────────────────────────
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ─── Build IPA (unsigned, no-codesign) ─────────────────────────
      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign

      # ─── Package as IPA ─────────────────────────────────────────────
      - name: Create Payload and IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../../../FFExternal.ipa Payload
          cd ../../..
          echo "IPA created: FFExternal.ipa"
          ls -lh FFExternal.ipa

      # ─── Upload artifact ────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-IPA
          path: FFExternal.ipa
          retention-days: 30

      # ─── Create release (on push to main only) ──────────────────────
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FF External v${{ github.run_number }}
          body: |
            ## FF External
            
            Automated build from commit ${{ github.sha }}
            
            ### Install
            Download `FFExternal.ipa` and sideload with:
            - TrollStore
            - AltStore / SideStore
            - Signer of your choice
            
            ### Features
            - Free Fire & Free Fire Max support
            - AimBody, AimNeck, AimDrag, Magic Bullet, Antena, Hologram
            - License key system
            - Auto backup & restore
            
            **Join: https://t.me/ffexternal**
          files: FFExternal.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
