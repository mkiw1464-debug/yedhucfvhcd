name: Build FF External IPA

on:
  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # ─── Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Flutter setup ─────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # ─── Ruby + CocoaPods ──────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version

      # ─── Flutter dependencies ─────────────────────────────────
      - name: Get Flutter dependencies
        run: flutter pub get

      # ─── Generate localization ─────────────────────────────────
      - name: Generate localization files
        run: flutter gen-l10n

      # ─── Generate missing iOS project ──────────────────────────
      - name: Generate iOS project
        run: |
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "Runner.xcodeproj is missing."
            echo "Generating iOS project with Flutter..."
            flutter create --platforms=ios .
          else
            echo "Runner.xcodeproj already exists."
          fi

      # ─── Verify iOS project ────────────────────────────────────
      - name: Verify iOS project
        run: |
          echo "Checking iOS project..."

          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: ios/Runner.xcodeproj/project.pbxproj was not generated."
            exit 1
          fi

          if [ ! -f "ios/Podfile" ]; then
            echo "ERROR: ios/Podfile is missing."
            exit 1
          fi

          echo "iOS project OK."
          find ios -maxdepth 2 -type f | sort | head -100

      # ─── CocoaPods ─────────────────────────────────────────────
      - name: CocoaPods install
        working-directory: ios
        run: |
          pod install --repo-update

        env:
          CI: true

      # ─── Xcode select ──────────────────────────────────────────
      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      # ─── Build iOS ─────────────────────────────────────────────
      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign

      # ─── Create IPA ────────────────────────────────────────────
      - name: Create Payload and IPA
        run: |
          set -e

          mkdir -p build/ios/ipa/Payload

          cp -R build/ios/iphoneos/Runner.app \
            build/ios/ipa/Payload/

          cd build/ios/ipa

          zip -r ../../../FFExternal.ipa Payload

          cd ../../..

          echo "========================================"
          echo "IPA created successfully"
          echo "========================================"

          ls -lh FFExternal.ipa

      # ─── Upload IPA ────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-IPA
          path: FFExternal.ipa
          if-no-files-found: error
