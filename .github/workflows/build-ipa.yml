name: Build FF External IPA

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      # ============================================================
      # RUBY / COCOAPODS
      # ============================================================
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version

      # ============================================================
      # FLUTTER DEPENDENCIES
      # ============================================================
      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      # ============================================================
      # LOCALIZATION
      # ============================================================
      - name: Generate localization
        run: |
          if [ -f "l10n.yaml" ]; then
            flutter gen-l10n
          else
            echo "No l10n.yaml found, skipping localization generation."
          fi

      # ============================================================
      # GENERATE IOS PROJECT IF MISSING
      # ============================================================
      - name: Generate iOS project
        run: |
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "Runner.xcodeproj missing."
            echo "Generating iOS project..."
            flutter create --platforms=ios .
          else
            echo "Runner.xcodeproj already exists."
          fi

      # ============================================================
      # VERIFY IOS PROJECT
      # ============================================================
      - name: Verify iOS project
        run: |
          echo "Checking iOS project..."

          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: Runner.xcodeproj/project.pbxproj is missing."
            exit 1
          fi

          if [ ! -f "ios/Podfile" ]; then
            echo "ERROR: ios/Podfile is missing."
            exit 1
          fi

          echo "iOS project OK."

      # ============================================================
      # POD INSTALL
      # ============================================================
      - name: CocoaPods install
        working-directory: ios
        run: |
          pod install --repo-update

      # ============================================================
      # DISABLE CODE SIGNING
      # ============================================================
      - name: Disable iOS code signing
        run: |
          python3 <<'PY'
          from pathlib import Path

          project = Path("ios/Runner.xcodeproj/project.pbxproj")

          if not project.exists():
              raise SystemExit("Runner.xcodeproj/project.pbxproj not found")

          text = project.read_text()

          replacements = {
              "CODE_SIGNING_ALLOWED = YES;":
                  "CODE_SIGNING_ALLOWED = NO;",

              "CODE_SIGNING_REQUIRED = YES;":
                  "CODE_SIGNING_REQUIRED = NO;",

              'CODE_SIGN_IDENTITY = "iPhone Developer";':
                  'CODE_SIGN_IDENTITY = "";',

              'CODE_SIGN_IDENTITY = "Apple Development";':
                  'CODE_SIGN_IDENTITY = "";',

              'CODE_SIGN_IDENTITY[sdk=iphoneos*] = "iPhone Developer";':
                  'CODE_SIGN_IDENTITY[sdk=iphoneos*] = "";',

              'CODE_SIGN_IDENTITY[sdk=iphoneos*] = "Apple Development";':
                  'CODE_SIGN_IDENTITY[sdk=iphoneos*] = "";',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          project.write_text(text)

          print("========================================")
          print("iOS code signing disabled")
          print("========================================")
          PY

      # ============================================================
      # VERIFY SIGNING SETTINGS
      # ============================================================
      - name: Verify signing settings
        run: |
          echo "Checking signing configuration..."

          grep -n "CODE_SIGNING_ALLOWED" \
            ios/Runner.xcodeproj/project.pbxproj || true

          grep -n "CODE_SIGNING_REQUIRED" \
            ios/Runner.xcodeproj/project.pbxproj || true

          echo "Signing configuration checked."

      # ============================================================
      # BUILD IOS
      # ============================================================
      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign

      # ============================================================
      # CREATE IPA
      # ============================================================
      - name: Create unsigned IPA
        run: |
          set -e

          APP_PATH="build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app was not generated."
            exit 1
          fi

          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload

          cp -R "$APP_PATH" build/ios/ipa/Payload/Runner.app

          cd build/ios/ipa

          zip -r ../../../../FFExternal.ipa Payload

          cd ../../..

          echo "========================================"
          echo "IPA BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh FFExternal.ipa

      # ============================================================
      # UPLOAD IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-IPA
          path: FFExternal.ipa
          if-no-files-found: error
